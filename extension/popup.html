<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			:root {
				--bg: #1e1e1e;
				--bg-hover: #2a2a2a;
				--border: #3a3a3a;
				--text: #f0f0f0;
				--text-dim: #aaaaaa;
				--accent: #1f6feb;
			}
			body {
				font: 13px system-ui, sans-serif;
				margin: 0;
				width: 340px;
				background-color: var(--bg);
				color: var(--text);
			}
			header {
				padding: 10px;
				border-bottom: 1px solid var(--border);
				font-weight: 600;
			}
			.list {
				max-height: 400px;
				overflow: auto;
			}
			.row {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 8px 10px;
				border-bottom: 1px solid var(--border);
			}
			.row:hover {
				background: var(--bg-hover);
			}
			img.fav {
				width: 16px;
				height: 16px;
			}
			.title {
				flex: 1;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			footer {
				display: flex;
				gap: 8px;
				padding: 10px;
				border-top: 1px solid var(--border);
			}
			button {
				padding: 6px 10px;
				border: 1px solid var(--border);
				background: var(--bg-hover);
				color: var(--text);
				border-radius: 6px;
				cursor: pointer;
			}
			button:hover {
				background: #353535;
			}
			button.primary {
				background: var(--accent);
				color: #fff;
				border-color: var(--accent);
			}

			.pin {
				font-size: 12px;
				opacity: 0.8;
			}
			.row .fav {
				margin-left: 2px;
			}
		</style>
	</head>
	<body>
		<header>Choose tabs</header>
		<div
			id="controls"
			style="display: flex; gap: 8px; padding: 8px 10px">
			<button id="selectAll">Select all</button>
			<button id="clear">Clear</button>
			<label style="margin-left: auto; color: var(--text-dim)">
				<input
					type="checkbox"
					id="includePinned"
					checked />
				include pinned
			</label>
		</div>
		<div
			id="list"
			class="list"></div>
		<footer>
			<button id="highlight">Highlight</button>
			<button id="close">Close</button>
			<button
				id="use"
				class="primary"
				style="margin-left: auto">
				Use selected
			</button>
		</footer>
		<script
			src="popup.js"
			type="module"></script>
	</body>
</html>
